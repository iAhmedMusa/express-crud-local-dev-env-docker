services:
  frontend:
    build: ./app
    container_name: frontend
    environment:
      - MONGODB_SERVER=mongodb
      - MONGODB_ADMINUSERNAME=${MONGODB_ADMINUSERNAME:-admin}
      - MONGODB_ADMINPASSWORD=${MONGODB_ADMINPASSWORD:-password}
      - DB_NAME=basicDB
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ADMINUSERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ADMINPASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mongo-data:
    driver: local
