services:
  frontend:
    build: ./app
    networks:
      - coolify
    labels:
      - "traefik.enable=true"

      # ── HTTP router (redirect to HTTPS) ──────────────────────────────────
      - "traefik.http.routers.frontend-http.rule=Host(`focusdigitalcolorlab.com`) || Host(`www.focusdigitalcolorlab.com`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"

      # ── HTTPS router ─────────────────────────────────────────────────────
      - "traefik.http.routers.frontend.rule=Host(`focusdigitalcolorlab.com`) || Host(`www.focusdigitalcolorlab.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

      # ── Service (tell Traefik which port the container listens on) ────────
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

      # ── Shared middleware: HTTP → HTTPS redirect ──────────────────────────
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    environment:
      - MONGODB_SERVER=mongodb
      - MONGODB_ADMINUSERNAME=${MONGODB_ADMINUSERNAME:-admin}
      - MONGODB_ADMINPASSWORD=${MONGODB_ADMINPASSWORD:-password}
      - DB_NAME=basicDB
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo
    networks:
      - coolify
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ADMINUSERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ADMINPASSWORD:-password}
    volumes:
      - mongo-data:/data/db

  mongo-gui:
    image: mongo-express
    networks:
      - coolify
    depends_on:
      - mongodb
    labels:
      - "traefik.enable=true"

      # ── HTTPS router ─────────────────────────────────────────────────────
      - "traefik.http.routers.mongo-gui.rule=Host(`staging.focusdigitalcolorlab.com`)"
      - "traefik.http.routers.mongo-gui.entrypoints=websecure"
      - "traefik.http.routers.mongo-gui.tls=true"
      - "traefik.http.routers.mongo-gui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mongo-gui.middlewares=mongo-gui-auth"

      # ── Service ───────────────────────────────────────────────────────────
      - "traefik.http.services.mongo-gui.loadbalancer.server.port=8081"

      # ── Basic-auth middleware (generate with: htpasswd -nb user pass) ─────
      # Replace the value below with your own htpasswd hash
      - "traefik.http.middlewares.mongo-gui-auth.basicauth.users=${MONGO_GUI_BASICAUTH_USERS}"
    environment:
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_ADMINUSERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_ADMINPASSWORD:-password}
      - ME_CONFIG_MONGODB_SERVER=mongodb

networks:
  coolify:
    external: true

volumes:
  mongo-data:
    driver: local
